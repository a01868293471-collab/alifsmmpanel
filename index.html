<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagad App Home Page</title>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --nagad-primary: #F58220;
            --nagad-deep: #E84A17;
            --nagad-light: #FFB347;
            --white: #FFFFFF;
            --text-light: #4B5563; /* গাঢ় কালো পরিবর্তন করে হালকা টেক্সট কালার */
            --bg: #F5F6F8;
            --border: #E5E7EB;
            --success: #16A34A;
            --danger: #DC2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* App Main Wrapper */
        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: var(--bg);
            min-height: 100vh;
            padding-bottom: 70px;
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        /* Top Nagad Header */
        .nagad-header {
            width: 100%;
            height: 185px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 25px;
            overflow: hidden;
        }

        .header-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .bell-icon {
            position: absolute;
            top: 18px;
            right: 20px;
            color: var(--white);
            font-size: 22px;
            cursor: pointer;
            z-index: 2;
        }

        /* Balance Button Area */
        .balance-btn-container {
            width: 50%;
            max-width: 250px;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .balance-btn-container.small-width {
            width: 35%;
            max-width: 170px;
        }

        .balance-btn {
            background-color: var(--white);
            height: 30px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            padding: 3px 8px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
            transition: transform 0.1s ease;
        }

        .balance-btn:active {
            transform: scale(0.98);
        }

        .balance-text {
            flex-grow: 1;
            text-align: center;
            color: var(--nagad-deep);
            font-size: 13px;
            font-weight: 700;
            padding-right: 4px;
        }

        /* Sections Grid Layout */
        .section-title {
            font-size: 14px;
            color: #666666;
            font-weight: 700;
            padding: 15px 20px 8px 20px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 0 10px;
        }

        /* প্রথম ৮টি বাটনের পরে কিছুটা ফাঁকা রাখার জন্য স্পেশাল মার্জিন */
        .services-grid.services-section {
            margin-bottom: 20px;
        }

        .service-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .service-icon-box {
            width: 68px;
            height: 68px;
            background: transparent;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            margin-bottom: 4px;
            transition: transform 0.1s;
            overflow: hidden;
            padding: 0;
        }

        .service-icon-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .service-card:active .service-icon-box {
            transform: scale(0.95);
        }

        /* বাটনের নামগুলো হালকা করার জন্য স্টাইল */
        .service-name {
            font-size: 12px;
            color: var(--text-light);
            font-weight: 500;
            line-height: 1.2;
        }

        /* Cover Banner Slider Section - চার কোনা এবং হালকা চিকন */
        .banner-container {
            width: 100%;
            padding: 10px 15px;
        }

        .banner-box {
            width: 100%;
            height: 110px; /* উচ্চতা কিছুটা কমিয়ে চিকন করা হয়েছে */
            background-color: #f0f0f0;
            border-radius: 2px; /* চারকোনা লুক দেওয়ার জন্য রেডিয়াস কমানো হয়েছে */
            overflow: hidden;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.5s ease-in-out;
        }

        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }

        .dot {
            width: 7px;
            height: 7px;
            background-color: #ccc;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: var(--nagad-deep);
            width: 16px;
            border-radius: 10px;
        }

/* Bottom Fixed Navigation Bar */
.bottom-nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    max-width: 450px;
    height: 62px;
    background-color: var(--white);
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid #EAEAEA;
    box-shadow: 0 -1px 5px rgba(0,0,0,0.03);
    z-index: 100;
}

.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #777777; /* নিষ্ক্রিয় বাটনের টেক্সট ও আইকন কালার */
    text-decoration: none;
    font-size: 11px;
    cursor: pointer;
    flex: 1;
}

/* আইকন সাইজ ও মার্জিন */
.nav-item i {
    font-size: 20px;
    margin-bottom: 4px;

}

/* হোম বাটনের জন্য ছোট লোগো ইমেজ */
.nav-icon-img {

}

/* সক্রিয় (Active/Home) বাটন স্টাইল */
.nav-item.active {

    font-weight: bold;
}

.nav-item.active span {
    color: #E84A17;
}
        /* Spinner Styles */
        .spinner {
            width: 15px;
            height: 15px;
            border: 2.5px dotted var(--nagad-deep);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .show-amount {

        }

        @keyframes fadeIn {

        }

            object-fit: cover;
            border-radius: 50%;
            display: block;
        }
    </style>

    <!-- JavaScript Logics -->
    <script>
        let isChecking = false;
        let isShowing = false;
        let timeoutId = null;

        function checkBalance() {
            if (isChecking) return;

            const btnLogo = document.getElementById('btnLogo');
            const balanceText = document.getElementById('balanceText');
            const container = document.getElementById('balanceBtnContainer');

            if (isShowing) {
                clearTimeout(timeoutId);
                resetButton();
                return;
            }

            isChecking = true;
            btnLogo.style.display = 'none';
            balanceText.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: center; gap: 6px;">
                    <div class="spinner"></div>
                    <span style="color: var(--nagad-deep); font-weight: 600; font-size: 12px;">ব্যালেন্স চেক করা হচ্ছে</span>
                </div>
            `;

            timeoutId = setTimeout(() => {
                isChecking = false;
                isShowing = true;

                container.classList.add('small-width');
                btnLogo.style.display = 'flex';
                balanceText.className = "balance-text show-amount";
                balanceText.innerHTML = `<span style="color: var(--nagad-deep); font-size: 13px; font-weight: 800;">10,767.36  টাকা</span>`;

                timeoutId = setTimeout(() => {
                    resetButton();
                }, 5000);

            }, 2500);
        }

        function resetButton() {
            const btnLogo = document.getElementById('btnLogo');
            const balanceText = document.getElementById('balanceText');
            const container = document.getElementById('balanceBtnContainer');

            isChecking = false;
            isShowing = false;

            container.classList.remove('small-width');
            btnLogo.style.display = 'flex';
            balanceText.className = "balance-text";
            balanceText.innerHTML = 'ব্যালেন্স জানতে ট্যাপ করুন';
        }

        /* ব্যানার স্লাইডার */
        const banners = [
            "https://picsum.photos/400/130?random=1",
            "https://picsum.photos/400/130?random=2",
            "https://picsum.photos/400/130?random=3"
        ];
        
        let currentSlide = 0;
        const bannerImg = document.getElementById('bannerImg');
        const dots = document.querySelectorAll('.slider-dots .dot');

        function autoSlide() {
            currentSlide = (currentSlide + 1) % banners.length;
            
            bannerImg.style.opacity = '0.3';
            setTimeout(() => {
                bannerImg.src = banners[currentSlide];
                bannerImg.style.opacity = '1';
            }, 200);

            dots.forEach((dot, index) => {
                if(index === currentSlide) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        setInterval(autoSlide, 3000);
    </script>
