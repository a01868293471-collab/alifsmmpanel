<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>এক্সক্লুসিভ ভিডিও প্লেয়ার</title>
    
    <!-- গুগল ফন্টস -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --brand-primary: #ff6b00;
            --brand-secondary: #ffb800;
            --brand-gradient: linear-gradient(135deg, #ff6b00 0%, #ffb800 100%);
            --telegram-color: #0088cc;
            --youtube-color: #ff0000;
            --border-color: #334155;
            --radius-main: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-main);
            padding: 24px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* হেডার */
        .header-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* শর্ত তালিকা */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .task-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .task-btn.telegram { border-color: rgba(0, 136, 204, 0.4); }
        .task-btn.youtube { border-color: rgba(255, 0, 0, 0.4); }

        .task-btn.completed {
            background: rgba(34, 197, 94, 0.1);
            border-color: #22c55e;
            color: #22c55e;
        }

        .badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        .task-btn.completed .badge {
            background: #22c55e;
            color: #fff;
        }

        /* সাবমিট বাটন */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Hind Siliguri', sans-serif;
            color: #fff;
            background: var(--brand-gradient);
            cursor: pointer;
            opacity: 0.4;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
        }

        .submit-btn.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* মোবাইল স্ক্রিন সাইজ ভিডিও প্লেয়ার ভিউ */
        .video-page {
            display: none;
            width: 100%;
            max-width: 380px; /* মোবাইল স্ক্রিন সাইজ প্রস্থ */
            margin: 0 auto;
        }

        .mobile-frame {
            position: relative;
            width: 100%;
            /* লম্বা ৯:১৬ অনুপাত (Vertical Reels / Mobile Video Style) */
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        }

        .telegram-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ডাউনলোডের চাপ বন্ধ করার জন্য অদৃশ্য সুরক্ষা লেয়ার */
        .protection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
            pointer-events: none; /* ভিডিওর মূল প্লে কন্ট্রোল অ্যাক্সেসের জন্য প্রয়োজন হলে সামঞ্জস্য করা যায় */
        }

        .player-header {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- ১. মূল ভেরিফিকেশন কার্ড -->
    <div class="container" id="gateCard">
        <h2 class="header-title">ভিডিওটি আনলক করুন</h2>
        <p class="header-subtitle">ভিডিওটি দেখতে নিচের দুটি শর্ত পুরন করুন</p>

        <div class="task-list">
            <a href="https://t.me/TOP_X_VIDEO" target="_blank" class="task-btn telegram" id="tgBtn" onclick="clickTask('tg')">
                <span>১. টেলিগ্রাম চ্যানেলে জয়েন করুন</span>
                <span class="badge" id="tgBadge">অসম্পূর্ণ</span>
            </a>

            <a href="https://youtube.com/@wangsingpong" target="_blank" class="task-btn youtube" id="ytBtn" onclick="clickTask('yt')">
                <span>২. ইউটিউব চ্যানেল সাবস্ক্রাইব করুন</span>
                <span class="badge" id="ytBadge">অসম্পূর্ণ</span>
            </a>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="openVideoPage()">ভিডিও দেখুন</button>
    </div>

    <!-- ২. লম্বা মোবাইল স্ক্রিন সাইজ ভিডিও প্লেয়ার পেজ -->
    <div class="video-page" id="videoPage">
        <div class="player-header">
            <span style="font-size: 14px; color: var(--text-muted);">প্লেয়ার ভিউ</span>
            <button class="back-btn" onclick="location.reload()">হোম</button>
        </div>
        
        <div class="mobile-frame">
            <!-- অ্যান্টি ডাউনলোড অদৃশ্য গ্লাস ওভারলে -->
            <div class="protection-overlay"></div>
            
            <!-- টেলিগ্রাম ভিডিও এমবেড আইফ্রেড -->
            <iframe 
                class="telegram-iframe" 
                id="tgPlayer"
                src="" 
                frameborder="0" 
                scrolling="no" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        // কনফিগারেশন - টেলিগ্রাম ও ইউটিউব বিবরণ
        const CONFIG = {
            // টেলিগ্রাম ভিডিও লিংক পোস্ট এর এমবেড সংস্করণ
            telegramVideoEmbedUrl: "https://t.me/c/4467531508/2?embed=1" 
        };

        let tgClicked = false;
        let ytClicked = false;

        function clickTask(type) {
            if (type === 'tg') {
                tgClicked = true;
                const btn = document.getElementById('tgBtn');
                const badge = document.getElementById('tgBadge');
                btn.classList.add('completed');
                badge.innerText = 'সম্পন্ন';
            } else if (type === 'yt') {
                ytClicked = true;
                const btn = document.getElementById('ytBtn');
                const badge = document.getElementById('ytBadge');
                btn.classList.add('completed');
                badge.innerText = 'সম্পন্ন';
            }
            checkStatus();
        }

        function checkStatus() {
            if (tgClicked && ytClicked) {
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.classList.add('active');
            }
        }

        function openVideoPage() {
            document.getElementById('gateCard').style.display = 'none';
            const videoPage = document.getElementById('videoPage');
            const player = document.getElementById('tgPlayer');
            
            // আইফ্রেম সোর্স সেট করা
            player.src = CONFIG.telegramVideoEmbedUrl;
            videoPage.style.display = 'block';
        }

        // সিকিউরিটি প্রোটেকশন - রাইট ক্লিক ও কিবোর্ড শর্টকাট বন্ধ
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
