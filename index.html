<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>এক্সক্লুসিভ ভিডিও প্লেয়ার</title>
    
    <!-- গুগল ফন্টস -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --brand-gradient: linear-gradient(135deg, #ff6b00 0%, #ffb800 100%);
            --border-color: #334155;
            --radius-main: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-main);
            padding: 24px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .task-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .task-btn.completed {
            background: rgba(34, 197, 94, 0.1);
            border-color: #22c55e;
            color: #22c55e;
        }

        .badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        .task-btn.completed .badge {
            background: #22c55e;
            color: #fff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Hind Siliguri', sans-serif;
            color: #fff;
            background: var(--brand-gradient);
            cursor: pointer;
            opacity: 0.4;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .submit-btn.active {
            opacity: 1;
            pointer-events: auto;
        }

        .video-page {
            display: none;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }

        .mobile-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--border-color);
        }

        .drive-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ১. উপরের পপ-আউট বাটন ও শিরোনাম ঢেকে ফেলার জন্য মাস্ক */
        .hide-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            z-index: 10;
            background: transparent;
        }

        /* ২. মাঝের ফালতু বাটনগুলো ঢাকার জন্য কাস্টম মাস্ক */
        .hide-middle-controls {
            position: absolute;
            top: 55%;
            left: 0;
            width: 100%;
            height: 65px;
            z-index: 10;
            background: transparent;
            pointer-events: none;
        }

        .player-header {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="container" id="gateCard">
        <h2 class="header-title">ভিডিওটি আনলক করুন</h2>
        <p class="header-subtitle">ভিডিওটি দেখতে নিচের দুটি শর্ত পূরণ করুন</p>

        <div class="task-list">
            <a href="https://t.me/TOP_X_VIDEO" target="_blank" class="task-btn" id="tgBtn" onclick="clickTask('tg')">
                <span>১. টেলিগ্রাম চ্যানেলে জয়েন করুন</span>
                <span class="badge" id="tgBadge">অসম্পূর্ণ</span>
            </a>

            <a href="https://youtube.com/@wangsingpong" target="_blank" class="task-btn" id="ytBtn" onclick="clickTask('yt')">
                <span>২. ইউটিউব চ্যানেল সাবস্ক্রাইব করুন</span>
                <span class="badge" id="ytBadge">অসম্পূর্ণ</span>
            </a>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="openVideoPage()">ভিডিও দেখুন</button>
    </div>

    <div class="video-page" id="videoPage">
        <div class="player-header">
            <span style="font-size: 14px; color: var(--text-muted);">প্লেয়ার ভিউ</span>
            <button class="back-btn" onclick="location.reload()">হোম</button>
        </div>
        
        <div class="mobile-frame">
            <!-- অপ্রয়োজনীয় আইকন বন্ধ রাখার সুরক্ষা মাস্ক -->
            <div class="hide-top-bar"></div>
            
            <iframe 
                class="drive-iframe" 
                id="drivePlayer"
                src="" 
                allow="autoplay">
            </iframe>
        </div>
    </div>

    <script>
        const CONFIG = {
            driveVideoUrl: "https://drive.google.com/file/d/14n073kHAEIwTjd8MUhBwoOsSWQ-Y6bJl/preview"
        };

        let tgClicked = false;
        let ytClicked = false;

        function clickTask(type) {
            if (type === 'tg') {
                tgClicked = true;
                document.getElementById('tgBtn').classList.add('completed');
                document.getElementById('tgBadge').innerText = 'সম্পন্ন';
            } else if (type === 'yt') {
                ytClicked = true;
                document.getElementById('ytBtn').classList.add('completed');
                document.getElementById('ytBadge').innerText = 'সম্পন্ন';
            }
            if (tgClicked && ytClicked) {
                document.getElementById('submitBtn').classList.add('active');
            }
        }

        function openVideoPage() {
            document.getElementById('gateCard').style.display = 'none';
            document.getElementById('videoPage').style.display = 'block';
            document.getElementById('drivePlayer').src = CONFIG.driveVideoUrl;
        }
    </script>
</body>
</html>
